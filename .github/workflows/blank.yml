name: CI

on:
  push:
    branches: [ "master", "threaded-trees", "disjoint-set-forest", "examples-verification-optimization" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Install .NET
        run: |
          sudo apt-get update
          sudo apt-get install -y dotnet6

      - name: Install Dafny
        run: |
          wget https://github.com/dafny-lang/dafny/releases/download/v4.3.0/dafny-4.3.0-x64-ubuntu-20.04.zip
          unzip dafny-4.3.0-x64-ubuntu-20.04.zip
          echo $PWD/dafny/ >> $GITHUB_PATH
          PATH=$PATH:$PWD/dafny/ dafny --version

      - name: Install Ninja
        run: sudo apt-get install ninja-build

      - name: Configure
        run: ./configure

      - name: Build
        run: ninja
